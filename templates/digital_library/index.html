{% extends "base.html" %}
{% block content %}

    <div class="books-grid">
      {% for book in books %}
        <div class="book-card">
          <a href="{% url "digital_library:book-detail" book.id %}"><img src="{{ book.cover_image.url }}" class="card-img-top book-cover" alt="{{ book.title }}"></a>
          <h3>
            <a href="{% url "digital_library:book-detail" book.id %}">
              {{ book.title }}
            </a>
          </h3>
          <p>{{ book.authors.all|join:", " }}</p>
          <p>Rating: {{ book.avg_rating|floatformat:1 }}</p>
        </div>
      {% endfor %}
    </div>

{% endblock %}
