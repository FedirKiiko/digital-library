{% extends "base.html" %}

{% block title %}
  Delete book
{% endblock %}

{% block content %}
  <h1>Delete "{{ object.title }}"?</h1>
  <p>This action cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'digital_library:book-detail' object.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
