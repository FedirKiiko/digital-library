{% extends "base.html" %}

{% block title %}
  Edit profile
{% endblock %}

{% block content %}
  <div class="col-md-6 mx-auto">
    <h1 class="mb-4">Edit profile</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'digital_library:profile' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
{% endblock %}
