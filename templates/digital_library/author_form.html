{% extends "base.html" %}

{% block title %}
  {% if form.instance.pk %}Edit author{% else %}Add author{% endif %}
{% endblock %}

{% block content %}
  <h1>{% if form.instance.pk %}Edit author{% else %}Add author{% endif %}</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
{% endblock %}
