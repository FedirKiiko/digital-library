<form method="get" class="search-form" role="search">
  <label class="sr-only" for="search">{{ label|default:"Search" }}</label>
  <input type="search" id="search" name="search" placeholder="{{ placeholder|default:'Search' }}" value="{{ request.GET.search }}">
  <button type="submit" class="btn btn-outline-primary">Search</button>
</form>
